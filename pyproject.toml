[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-engine"
version = "2.0.0"
description = "Production-grade LLM agent framework with Jordan algebraic MoE routing"
requires-python = ">=3.11"
license = {text = "Proprietary"}
authors = [
    {name = "SnapKitty", email = "jessicalw34@gmail.com"}
]

[project.scripts]
sovereign = "src.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
